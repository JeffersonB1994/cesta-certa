<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cesta Certa</title>
<style>
  :root { --azul:#0B4F8A; --verde:#1B7F3B; --vermelho:#B3261E; --cinza:#5F6368; --fundo:#F5F7FA; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Arial, sans-serif; font-size:18px; background:var(--fundo); color:#1F1F1F; }
  header { background:var(--azul); color:#fff; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:24px; margin:0; }
  main { max-width:480px; margin:0 auto; padding:20px; }
  label { display:block; font-weight:700; margin:16px 0 6px; }
  input { width:100%; min-height:48px; font-size:18px; padding:10px 14px; border:2px solid var(--cinza); border-radius:10px; }
  button { min-height:48px; min-width:44px; font-size:18px; font-weight:700; border:none; border-radius:12px; padding:12px 20px; cursor:pointer; }
  button:focus-visible, input:focus-visible { outline:3px solid #F9A825; outline-offset:2px; }
  .principal { width:100%; background:var(--azul); color:#fff; margin-top:20px; }
  .entregar { width:100%; background:var(--verde); color:#fff; margin-top:12px; }
  .entregar:disabled { background:#C4C7CC; color:#3C4043; cursor:not-allowed; }
  .sair { background:#fff; color:var(--azul); min-height:44px; padding:8px 16px; }
  .marca { text-align:center; margin:24px 0; }
  .marca h2 { color:var(--azul); font-size:34px; margin:8px 0 4px; }
  .card { background:#fff; border:1px solid #DADCE0; border-radius:14px; padding:16px; margin-top:14px; }
  .card h3 { margin:0 0 4px; font-size:22px; }
  .etiqueta { display:inline-block; font-weight:700; padding:6px 12px; border-radius:20px; margin-top:8px; }
  .pode { background:#E6F4EA; color:var(--verde); }
  .recebeu { background:#ECEFF1; color:#3C4043; }
  .alerta { border-radius:14px; padding:20px; margin-top:20px; text-align:center; border:3px solid; }
  .alerta .icone { font-size:48px; display:block; }
  .alerta strong { display:block; font-size:24px; margin:8px 0; }
  .sucesso { background:#E6F4EA; border-color:var(--verde); color:var(--verde); }
  .erro { background:#FDECEA; border-color:var(--vermelho); color:var(--vermelho); }
  .erro-campo { color:var(--vermelho); font-weight:700; margin-top:12px; }
  .oculto { display:none; }
  .ajuda { color:var(--cinza); font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>Cesta Certa</h1>
  <button id="btn-sair" class="sair oculto" type="button">Sair</button>
</header>

<main>
  <!-- Tela 1: Login -->
  <section id="tela-login" aria-labelledby="titulo-login">
    <div class="marca">
      <h2 id="titulo-login">Cesta Certa</h2>
      <p>Controle de entregas de cestas básicas</p>
      <p class="ajuda">Associação Comunitária Mãos Solidárias</p>
    </div>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" required>
      <p id="erro-login" class="erro-campo oculto" role="alert"></p>
      <button class="principal" type="submit">Entrar</button>
    </form>
  </section>

  <!-- Tela 2: Busca e registro de entrega -->
  <section id="tela-busca" class="oculto" aria-labelledby="titulo-busca">
    <h2 id="titulo-busca">Registrar entrega</h2>
    <form id="form-busca">
      <label for="busca">Nome ou CPF</label>
      <input id="busca" type="search" required>
      <button class="principal" type="submit">Buscar</button>
    </form>
    <p id="info-busca" class="ajuda" aria-live="polite"></p>
    <div id="resultados"></div>
  </section>

  <!-- Tela 3: Resultado -->
  <section id="tela-resultado" class="oculto" aria-labelledby="titulo-resultado">
    <h2 id="titulo-resultado">Resultado da entrega</h2>
    <div id="alerta" class="alerta" role="alert">
      <span class="icone" aria-hidden="true"></span>
      <strong></strong>
      <p></p>
    </div>
    <button id="btn-voltar" class="principal" type="button">Voltar para a busca</button>
  </section>
</main>

<script>
  let token = null;
  const $ = (id) => document.getElementById(id);

  function mostrar(tela) {
    ["tela-login", "tela-busca", "tela-resultado"].forEach((t) => $(t).classList.toggle("oculto", t !== tela));
    $("btn-sair").classList.toggle("oculto", tela === "tela-login");
  }

  async function api(caminho, opcoes = {}) {
    opcoes.headers = Object.assign({}, opcoes.headers, token ? { Authorization: "Bearer " + token } : {});
    const resposta = await fetch(caminho, opcoes);
    const dados = await resposta.json().catch(() => ({}));
    return { ok: resposta.ok, status: resposta.status, dados };
  }

  // Tela 1 – Login
  $("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const corpo = new URLSearchParams({ username: $("email").value, password: $("senha").value });
    const r = await api("/auth/login", { method: "POST", body: corpo });
    if (r.ok) {
      token = r.dados.access_token;
      $("erro-login").classList.add("oculto");
      $("senha").value = "";
      mostrar("tela-busca");
      $("busca").focus();
    } else {
      $("erro-login").textContent = "✖ " + (r.dados.detail || "Não foi possível entrar");
      $("erro-login").classList.remove("oculto");
    }
  });

  // Tela 2 – Busca
  $("form-busca").addEventListener("submit", async (e) => {
    e.preventDefault();
    const r = await api("/familias?busca=" + encodeURIComponent($("busca").value));
    const lista = $("resultados");
    lista.replaceChildren();
    if (!r.ok) { $("info-busca").textContent = "Não foi possível buscar."; return; }
    $("info-busca").textContent = r.dados.length + " família(s) encontrada(s)";
    r.dados.forEach((f) => {
      const card = document.createElement("div");
      card.className = "card";
      const nome = document.createElement("h3");
      nome.textContent = f.nome_responsavel;            // textContent: evita XSS
      const cpf = document.createElement("div");
      cpf.className = "ajuda";
      cpf.textContent = "CPF " + f.cpf_mascarado;
      const etiqueta = document.createElement("span");
      etiqueta.className = "etiqueta " + (f.recebeu_no_mes ? "recebeu" : "pode");
      etiqueta.textContent = f.recebeu_no_mes ? "● Já recebeu este mês" : "✔ Pode receber";
      const botao = document.createElement("button");
      botao.type = "button";
      botao.className = "entregar";
      botao.textContent = "Confirmar entrega";
      botao.disabled = f.recebeu_no_mes;
      botao.setAttribute("aria-label", "Confirmar entrega para " + f.nome_responsavel);
      botao.addEventListener("click", () => entregar(f));
      card.append(nome, cpf, etiqueta, botao);
      lista.append(card);
    });
  });

  // Tela 3 – Resultado
  async function entregar(familia) {
    const r = await api("/entregas", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ familia_id: familia.id }),
    });
    const alerta = $("alerta");
    if (r.ok) {
      alerta.className = "alerta sucesso";
      alerta.querySelector(".icone").textContent = "✔";
      alerta.querySelector("strong").textContent = "Entrega registrada";
      alerta.querySelector("p").textContent = familia.nome_responsavel + " – " + new Date().toLocaleDateString("pt-BR");
    } else {
      alerta.className = "alerta erro";
      alerta.querySelector(".icone").textContent = "✖";
      alerta.querySelector("strong").textContent = "Entrega não registrada";
      alerta.querySelector("p").textContent = r.dados.detail || "Tente novamente.";
    }
    mostrar("tela-resultado");
    $("btn-voltar").focus();
  }

  $("btn-voltar").addEventListener("click", () => {
    $("busca").value = "";
    $("resultados").replaceChildren();
    $("info-busca").textContent = "";
    mostrar("tela-busca");
    $("busca").focus();
  });

  $("btn-sair").addEventListener("click", () => {
    token = null;
    $("busca").value = "";
    $("resultados").replaceChildren();
    mostrar("tela-login");
  });
</script>
</body>
</html>
